<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trivikram // Java Programming Laboratory Record (25EU02067)</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

  <!-- Sticky Top Navigation Bar -->
  <nav class="top-nav" id="topNav">
    <div class="top-brand" onclick="navigateTo('home')">
      <span>⚡</span> TRIVIKRAM <span class="highlight">// JAVA</span>
    </div>

    <button class="chip active" data-page="home" onclick="navigateTo('home')">
      ⌂ Home
    </button>
    <button class="chip" data-page="profile" onclick="navigateTo('profile')">
      👤 Profile
    </button>

    <!-- Dynamic Week Chips rendered via script.js -->
    <div id="weekChipsContainer" style="display: inline-flex; gap: 8px;"></div>

    <button class="chip chip-search" onclick="openSearchModal()">
      🔍 Search (Ctrl+K)
    </button>
  </nav>

  <!-- Main View Container -->
  <main id="app"></main>

  <!-- Global Search Command Palette Modal -->
  <div class="search-overlay" id="searchModal" onclick="handleSearchBackdrop(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-header">
        <span style="font-weight: 900; font-size: 18px; color: var(--blue-primary);">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input-field" 
          placeholder="Search 100+ Java programs, concepts, syntax (e.g. tokenizer, inheritance)..." 
          oninput="handleSearchInput(event)"
        >
        <span style="font-weight: 900; font-size: 12px; background: var(--ink); color: #fff; padding: 2px 8px; border: 2px solid var(--ink);">ESC</span>
      </div>
      <div class="search-results-list" id="searchResults"></div>
      <div style="padding: 10px 18px; background: var(--surface-alt); border-top: 2px solid var(--ink); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between;">
        <span>Press ESC to exit &bull; Click any program to inspect</span>
        <span>11 Weeks &bull; 100+ Verified Programs</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toastNotice">
    <span>✓</span>
    <span id="toastMessage">Copied to clipboard!</span>
  </div>

  <!-- Core Scripts -->
  <script src="data.js?v=4.0"></script>
  <script src="script.js?v=4.0"></script>
</body>
</html>
