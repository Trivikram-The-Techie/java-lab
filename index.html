<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trivikram — Java Programming Laboratory Record (25EU02067)</title>
  
  <!-- Modern Developer Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
  <!-- Ambient Radial Glows -->
  <div class="ambient-glow ambient-1"></div>
  <div class="ambient-glow ambient-2"></div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-icon">⚡</div>
        <div class="brand-info">
          <div class="brand-title">Trivikram</div>
          <div class="brand-subtitle">Java Lab Record &bull; 25EU02067</div>
        </div>
      </div>
      <div class="student-status-badge">
        <span class="status-dot-pulse"></span>
        <span>II-Year &bull; AI &amp; ML &bull; Sec-B</span>
      </div>
    </div>

    <!-- Quick Search Shortcut -->
    <button class="sidebar-search-btn" id="sidebarSearchBtn" onclick="openSearchModal()">
      <span>🔍 Search programs...</span>
      <span class="search-shortcut">Ctrl K</span>
    </button>

    <!-- Nav Links -->
    <nav class="sidebar-nav">
      <div class="nav-section-title">Navigation</div>
      <button class="nav-link active" data-page="home" onclick="navigateTo('home')">
        <span class="nav-link-icon">🏠</span>
        <span class="nav-link-title">Overview</span>
      </button>
      <button class="nav-link" data-page="profile" onclick="navigateTo('profile')">
        <span class="nav-link-icon">👤</span>
        <span class="nav-link-title">Student Profile</span>
      </button>

      <div class="nav-section-title">Laboratory Weeks</div>
      <div id="weekNavList">
        <!-- Rendered dynamically via script.js -->
      </div>
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-profile-mini" onclick="navigateTo('profile')">
        <img class="mini-avatar" id="miniAvatarImg" src="assets/profile.png" alt="Trivikram" onerror="handleAvatarFallback(this)">
        <div class="mini-info">
          <span class="mini-name">Trivikram</span>
          <span class="mini-roll">25EU02067</span>
        </div>
      </div>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        ◐
      </button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Topbar Header -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu">
          ☰
        </button>
        <div class="breadcrumbs" id="breadcrumbs">
          <span class="breadcrumb-item" onclick="navigateTo('home')">Home</span>
          <span class="breadcrumb-separator">/</span>
          <span class="breadcrumb-item active">Overview</span>
        </div>
      </div>

      <div class="topbar-right">
        <button class="topbar-action-btn" onclick="openSearchModal()" title="Search programs (Ctrl+K)">
          🔍
        </button>
        <button class="topbar-action-btn" onclick="toggleTheme()" title="Toggle Theme">
          ◐
        </button>
        <div class="student-tag-pill">
          <span>Trivikram</span>
          &bull;
          <strong>25EU02067</strong>
          &bull;
          <span>AI&amp;ML-B</span>
        </div>
      </div>
    </header>

    <!-- Dynamic Main Application Canvas -->
    <main id="app">
      <!-- Injected dynamically by script.js -->
    </main>
  </div>

  <!-- Global Command Palette / Search Modal -->
  <div class="search-modal-backdrop" id="searchModal" onclick="handleSearchBackdrop(event)">
    <div class="search-modal-dialog" onclick="event.stopPropagation()">
      <div class="search-modal-header">
        <span>🔍</span>
        <input type="text" id="searchInput" class="search-modal-input" placeholder="Type to search across all 100+ Java programs, concepts, syntax..." oninput="handleSearchInput(event)">
        <span class="search-shortcut">ESC</span>
      </div>
      <div class="search-modal-results" id="searchResults">
        <!-- Rendered search matches -->
      </div>
      <div class="search-modal-footer">
        <span>Use ↑ ↓ to navigate &bull; Enter to select</span>
        <span>11 Weeks &bull; 100+ Programs</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-notice" id="toastNotice">
    <span>✓</span>
    <span id="toastMessage">Copied to clipboard!</span>
  </div>

  <!-- Core Scripts -->
  <script src="data.js?v=3.0"></script>
  <script src="script.js?v=3.0"></script>
</body>
</html>
