<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Trivikram // Java Programming Laboratory Record (25EU02067)</title>

  <!-- Modern Developer Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css?v=8.0">
</head>
<body>

  <!-- Sticky Top Navigation Bar -->
  <nav class="top-nav" id="topNav">
    <div class="top-brand" onclick="navigateTo('home')">
      <div class="brand-emblem-shape">
        <span>T</span>
      </div>
      TRIVIKRAM <span class="highlight">// JAVA</span>
    </div>

    <button class="chip active" data-page="home" onclick="navigateTo('home')">
      <!-- Custom Isometric Blueprint Home SVG -->
      <svg class="svg-icon stroke" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      Home
    </button>
    <button class="chip" data-page="profile" onclick="navigateTo('profile')">
      <!-- Custom Hexagon User Shield SVG -->
      <svg class="svg-icon stroke" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profile
    </button>

    <!-- Dynamic Week Chips rendered via script.js -->
    <div id="weekChipsContainer" style="display: inline-flex; gap: 8px;"></div>

    <button class="chip chip-search" onclick="openSearchModal()">
      <!-- Custom Cyber Viewfinder Search SVG -->
      <svg class="svg-icon stroke" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>
      Search (Ctrl+K)
    </button>
  </nav>

  <!-- Main View Container -->
  <main id="app"></main>

  <!-- Global Search Command Palette Modal -->
  <div class="search-overlay" id="searchModal" onclick="handleSearchBackdrop(event)">
    <div class="search-modal" onclick="event.stopPropagation()">
      <div class="search-header">
        <svg class="svg-icon stroke" style="width: 22px; height: 22px; stroke: var(--blue-primary);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input-field" 
          placeholder="Search 100+ Java programs, concepts, syntax (e.g. tokenizer, inheritance)..." 
          oninput="handleSearchInput(event)"
        >
        <kbd style="font-size: 11px; font-family: var(--font-mono); font-weight: 600; background: var(--bg-surface-alt); color: var(--text-muted); padding: 3px 8px; border: 1px solid var(--border-light); border-radius: var(--radius-xs);">ESC</kbd>
      </div>
      <div class="search-results-list" id="searchResults"></div>
      <div style="padding: 12px 20px; background: var(--bg-surface-alt); border-top: 1px solid var(--border-light); font-size: 12px; color: var(--text-muted); font-weight: 500; display: flex; justify-content: space-between;">
        <span>Press ESC to exit &bull; Click any program to inspect</span>
        <span>11 Weeks &bull; 100+ Verified Programs</span>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toastNotice">
    <svg class="svg-icon stroke" style="stroke: #ffffff;" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toastMessage">Copied to clipboard!</span>
  </div>

  <!-- Core Scripts -->
  <script src="data.js?v=8.0"></script>
  <script src="script.js?v=8.0"></script>
</body>
</html>
